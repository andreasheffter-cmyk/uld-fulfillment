<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Anfrage gesendet | ULD Fulfillment</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="3;url=/kontakt" />
    <style>
      body { font-family: Arial, sans-serif; margin: 3rem auto; max-width: 36rem; color: #063f70; }
      a { color: #d13c22; }
    </style>
  </head>
  <body>
    <form name="angebot" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="angebot" />
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="shop" />
      <input name="volume" />
      <textarea name="message"></textarea>
    </form>
    <h1>Anfrage ist raus.</h1>
    <p>Wir melden uns in der Regel innerhalb eines Werktags.</p>
    <p><a href="/kontakt">Zurück zum Kontakt</a></p>
  </body>
</html>
