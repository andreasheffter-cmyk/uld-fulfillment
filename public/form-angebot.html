<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Anfrage gesendet | ULD Fulfillment</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <form name="angebot" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="angebot" />
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="shop" />
      <input name="volume" />
      <textarea name="message"></textarea>
    </form>
    <p>Anfrage ist raus. <a href="/kontakt">Zurück</a></p>
  </body>
</html>
